    <div class="dday-bar" id="dday-bar">

        </div>
        <div class="dday-countdown" aria-live="polite">
          <div class="dday-flip" id="dday-flip" aria-label="D-day countdown"></div>
        </div>
        <div class="dday-meta">
          <a href="concert.html" class="dday-link" id="dday-link" data-i18n="dday.linkConcert">예매하기</a>

            <input type="checkbox" class="dday-hide__input" id="dday-hide-today" />
            <span class="dday-hide__label" data-i18n="dday.hideToday">오늘 하루 보이지 않기</span>
          </label>
        </div>
      </div>
      <div class="dday-progress" aria-hidden="true">
        <span class="dday-progress-fill" id="dday-progress"></span>
      </div>
