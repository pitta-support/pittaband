    <header class="site-header">
      <div class="header-inner">
        <a href="index.html" class="logo" aria-label="Pitta Support">
          <span class="logo-wordmark">
            <span class="logo-wordmark__brand">Pitta</span>
            <span class="logo-wordmark__slash" aria-hidden="true"></span>
            <span class="logo-wordmark__tag">Support</span>
          </span>
        </a>

        <nav
          class="nav-desktop"
          data-i18n-attr="aria-label:header.navLabel"
          aria-label="주요 메뉴"
        >
          <a
            href="about.html"
            class="nav-link"
            data-nav-page="about"
            data-i18n="nav.about"
            >About</a
          >
          <a
            href="album.html"
            class="nav-link"
            data-nav-page="album"
            data-i18n="nav.album"
            >Album</a
          >
          <a
            href="concert.html"
            class="nav-link"
            data-nav-page="concert"
            data-i18n="nav.concert"
            >Concert</a
          >
        </nav>

        <div class="header-meta">
          <div class="lang-switcher">
            <select
              id="lang-select"
              class="lang-select"
              data-i18n-attr="aria-label:lang.label"
              aria-label="언어"
            >
              <option value="ko">한국어</option>
              <option value="en">English</option>
              <option value="ja">日本語</option>
              <option value="es">Español</option>
            </select>
          </div>
        </div>

        <button
          class="menu-toggle"
          id="menu-toggle"
          data-i18n-attr="aria-label:header.menuOpen"
          aria-label="메뉴 열기"
          aria-expanded="false"
        >
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>
