name: Fetch Spotify streaming stats

on:
  schedule:
    # 06:00 KST — Spotify play counts often lag right at midnight,
    # which produced many delta=0 snapshots. Morning catch is more stable.
    - cron: "0 6 * * *"
      timezone: Asia/Seoul
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Spotify secrets
        env:
          HAS_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID != '' }}
          HAS_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET != '' }}
        run: |
          echo "SPOTIFY_CLIENT_ID set: ${HAS_CLIENT_ID}"
          echo "SPOTIFY_CLIENT_SECRET set: ${HAS_CLIENT_SECRET}"
          if [ "${HAS_CLIENT_ID}" != "true" ] || [ "${HAS_CLIENT_SECRET}" != "true" ]; then
            echo "::error::Missing Spotify secrets. Add SPOTIFY_CLIENT_ID and SPOTIFY_CLIENT_SECRET under Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch Spotify stats
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: npm run fetch:streaming

      - name: Commit updated stats
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update Spotify streaming stats"
          file_pattern: data/streaming-stats.json
          skip_dirty_check: false
