  <body data-page="festival" data-nav-section="concert">
    <a
      class="skip-link"
      href="#main-content"
      data-i18n="accessibility.skipToContent"
      >본문 바로가기</a

    <div class="scanlines" aria-hidden="true"></div>
    <div class="grid-overlay" aria-hidden="true"></div>

    <!-- @include partials/dday-bar.html -->

    <main class="site-main" id="main-content">
      <article class="site-page site-page--festival">
        <header class="site-page__header">
          <span class="site-page__id">FST-01</span>
          <h1 class="site-page__title" data-i18n="pages.festival.title">
            Festival
          </h1>
          <div class="concert-switch">
            <a
              href="concert.html"
              class="concert-switch__btn"
              data-i18n="pages.concert.title"
              >Concert</a
            >
          </div>
        </header>
        <div class="site-page__body">
          <ul
            class="festival-gallery"
            id="festival-gallery"
            aria-label="Festival gallery"
          ></ul>
        </div>
      </article>
    </main>

    <div class="festival-modal" id="festival-modal" hidden aria-hidden="true">
      <div
        class="festival-modal__backdrop"
        data-festival-close
        tabindex="-1"
        aria-hidden="true"
      ></div>
      <div
        class="festival-modal__panel"
        id="festival-modal-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="festival-modal-heading"
      >
        <header class="overlay-header festival-modal__header">
          <span class="overlay-id" id="festival-modal-id"></span>
          <div class="festival-modal__head">
            <h2
              class="overlay-title festival-modal__title"
              id="festival-modal-heading"
            ></h2>
            <span
              class="festival-modal__instagram-slot"
              id="festival-modal-instagram"
            ></span>
          </div>
          <button
            type="button"
            class="overlay-close"
            data-festival-close
            data-i18n-attr="aria-label:overlay.close"
            aria-label="닫기"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M6 6l12 12M18 6L6 18"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </header>
        <div
          class="overlay-body festival-modal__body"
          id="festival-modal-body"
        ></div>
      </div>
    </div>

              <li>

                  target="_blank"
                  rel="noopener noreferrer"
                  data-i18n-attr="aria-label:footer.instagram"
                  aria-label="Instagram"
                >
                  <span class="footer-social__icon" aria-hidden="true">
                    <svg
                      viewBox="0 0 24 24"

                      <rect x="3" y="3" width="18" height="18" rx="5" />
